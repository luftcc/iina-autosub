[project]
name = "iina-autosub"
version = "0.1.0"
description = "One-shot local Japanese-to-Chinese subtitle generator and IINA plugin powered by Apple Silicon MLX"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=1.26.0,<3.0.0",
  "onnxruntime>=1.19.0",
  "pysubs2>=1.7.3",
  "mlx-whisper>=0.4.2",
  "mlx-lm>=0.22.0",
  "huggingface-hub>=0.26.0",
  "openai>=1.55.0",
  "httpx>=0.27.0",
  "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
iina-autosub = "iina_autosub.cli:main"
iina-autosub-server = "iina_autosub.server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iina_autosub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
